skip-commit-generation-prompt = true

# Leave the invoking shell in place; the interactive zsh wrapper opens the
# selected worktree in tmux instead.
[switch]
cd = false

# Seed local tool config on create/switch from the default branch's worktree,
# falling back to the primary worktree when the default branch isn't checked out.
# Never replace a file (or symlink) already present in the destination.
[post-switch]
local-config = """
branch={{ default_branch }}
source=$(git -c core.quotePath=false worktree list --porcelain | awk -v branch="refs/heads/$branch" '
  $1 == "worktree" { path = substr($0, 10) }
  $1 == "branch" && $2 == branch { print path; exit }
')
if [ -z "$source" ]; then
  source={{ primary_worktree_path }}
fi
if [ -n "$source" ] && [ "$source" != "$PWD" ]; then
  for file in .nvim-tools.lua mise.local.toml; do
    if [ -f "$source/$file" ] && [ ! -e "$file" ] && [ ! -L "$file" ]; then
      cp "$source/$file" "$file"
    fi
  done
fi
"""
pnpm-install = "if [ -f pnpm-lock.yaml ]; then pnpm install; fi"
