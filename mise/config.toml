[tools]
node = "latest"
go = "latest"
zig = "latest"
golangci-lint = "latest"
terraform = "latest"
nub = { version = "latest", allow_builds = ["@nubjs/nub"] }
uv = "latest"
gh = "latest"
jq = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]
python.uv_venv_auto = "create|source"
dotfiles.root = "~/.dotfiles"

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.mise_shell_activate]
zprofile = { enabled = true, mode = "shims" }
zshrc = { enabled = true, mode = "activate" }

[bootstrap.packages]
"pacman:base-devel" = "latest"
"pacman:git" = "latest"
"pacman:curl" = "latest"
"pacman:zsh" = "latest"
"pacman:kitty" = "latest"
"pacman:ghostty" = "latest"

"aur:google-chrome" = "latest"
"aur:visual-studio-code-bin" = "latest"

[bootstrap.repos]
"~/.dotfiles" = { url = "git@github.com:rickyhugo/dotfiles.git" }
"~/.zsh-plugins/zsh-vi-mode" = { url = "https://github.com/jeffreytse/zsh-vi-mode.git" }
"~/.zsh-plugins/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab.git" }
"~/.zsh-plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }
"~/.zsh-plugins/ohmyzsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.zsh-plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting.git" }
"~/.zsh-plugins/catppuccin-tmux" = { url = "https://github.com/catppuccin/tmux.git" }

[bootstrap.services.mise-history]
builtin = "history-watch"

[history.origin]
url = "https://github.com/rickyhugo/mise-setup.git"
branch = "main"

[dotfiles]
"~/.config/btop" = { source = "~/.dotfiles/btop", mode = "symlink" }
"~/.config/chrome-flags.conf" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/code-flags.conf" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/fsh" = { source = "~/.dotfiles/fsh", mode = "symlink" }
"~/.config/gh/config.yml" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/gh/hosts.yml" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/hypr" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/k9s" = { source = "~/.dotfiles/k9s", mode = "symlink" }
"~/.config/kitty" = { source = "~/.dotfiles/kitty", mode = "symlink" }
"~/.config/kmonad" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/lazydocker" = { source = "~/.dotfiles/lazydocker", mode = "symlink" }
"~/.config/lazygit" = { source = "~/.dotfiles/lazygit", mode = "symlink" }
"~/.config/mako" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/mise/config.personal.toml" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/nvim" = { source = "~/.dotfiles/nvim", mode = "symlink" }
"~/.config/obsidian/user-flags.conf" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/opencode" = { source = "~/.dotfiles/opencode", mode = "symlink" }
"~/.config/starship.toml" = { source = "~/.dotfiles/starship/starship.toml", mode = "symlink" }
"~/.config/tms/config.toml" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/uwsm" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/vicinae" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/waybar" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.config/yazi" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.gitconfig" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.global.gitignore" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.taplo.toml" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.tmux.conf" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.wallpapers" = { source = "~/.dotfiles/wallpapers", mode = "symlink" }
"~/.zprofile" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }
"~/.zshrc" = { mode = "track", variants = [{ os = "linux", profile = "personal" }] }

[dotfiles."vscode/settings.json"]
source = "~/.dotfiles/vscode/settings.json"
mode = "symlink"
variants = [
    { os = "macos", target = "~/Library/Application Support/Code/User/settings.json" },
    { os = "linux", target = "~/.config/Code/User/settings.json" },
]

[dotfiles."vscode/keybindings.json"]
source = "~/.dotfiles/vscode/keybindings.json"
mode = "symlink"
variants = [
    { os = "macos", target = "~/Library/Application Support/Code/User/keybindings.json" },
    { os = "linux", target = "~/.config/Code/User/keybindings.json" },
]
